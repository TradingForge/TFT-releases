# Shown on the "New issue" page, above the templates. The point is to catch the two things that are not
# bugs BEFORE someone files one: questions belong in Discussions, and a security problem must not be
# described in public at all. Without this, both land in the tracker and bury the actual defects.
blank_issues_enabled: false

contact_links:
  - name: Question, idea, or showing what you built
    url: https://github.com/TradingForge/TFT-releases/discussions
    about: Ask in Discussions - anything that is not a defect report belongs there.

  - name: Security problem
    url: https://github.com/TradingForge/TFT-releases/security/advisories/new
    about: Report it privately. Do not describe it in a public issue - every installed copy stays vulnerable until users update.

  - name: Downloads and release notes
    url: https://github.com/TradingForge/TFT-releases/releases/latest
    about: Latest installers, checksums and what changed.
