<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="13" role="img" aria-label="Strategy scripts from MT4, MT5 and TradingView enter the TradingForge Terminal (Runtime and Transpiler), which routes orders to MT4, Binance USDT futures, OKX, cTrader, Interactive Brokers, FIX-protocol brokers, proprietary-API brokers, DEXes and custom backends.">
	<title>TradingForge Terminal — scripts in, brokers out</title>
	<defs>
		<marker id="hub-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
			<path d="M0,0 L10,5 L0,10 z" fill="#ff7a18"/>
		</marker>
	</defs>

	<!-- background so it reads on both GitHub themes -->
	<rect x="0" y="0" width="1000" height="400" fill="#0f1117"/>

	<!-- column labels -->
	<text x="20"  y="14" fill="#9aa3b2" font-size="11.5" letter-spacing="1.2">STRATEGY SOURCE</text>
	<text x="980" y="14" fill="#9aa3b2" font-size="11.5" letter-spacing="1.2" text-anchor="end">BROKERS &amp; EXCHANGES</text>

	<!-- left: sources -->
	<rect x="20" y="89"  width="190" height="34" rx="7" fill="#161922" stroke="#ff7a18" stroke-width="1.5"/><text x="115" y="111" text-anchor="middle" fill="#e6e8ee">MT4 script</text>
	<rect x="20" y="145" width="190" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="115" y="167" text-anchor="middle" fill="#9aa3b2">MT5 script</text>
	<rect x="20" y="201" width="190" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="115" y="223" text-anchor="middle" fill="#9aa3b2">TradingView</text>

	<!-- source wires -> runtime -->
	<path d="M210,106 C290,106 290,162 372,162" fill="none" stroke="#ff7a18" stroke-width="1.3"/>
	<path d="M210,162 C290,162 290,162 372,162" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M210,218 C290,218 290,162 372,162" fill="none" stroke="#3a4152" stroke-width="1.3"/>

	<!-- centre: TFT -->
	<rect x="376" y="88" width="248" height="224" rx="12" fill="#1b1407" stroke="#ff7a18" stroke-width="1.5"/>
	<text x="500" y="112" text-anchor="middle" fill="#ffb24d" font-weight="700">TradingForge Terminal</text>

	<rect x="400" y="140" width="200" height="44" rx="8" fill="#161922" stroke="#3a4152"/>
	<text x="500" y="167" text-anchor="middle" fill="#e6e8ee">TFT Runtime</text>

	<line x1="500" y1="184" x2="500" y2="234" stroke="#ff7a18" stroke-width="1.4" marker-end="url(#hub-ar)"/>

	<rect x="400" y="238" width="200" height="44" rx="8" fill="#161922" stroke="#3a4152"/>
	<text x="500" y="265" text-anchor="middle" fill="#e6e8ee">TFT Transpiler</text>

	<!-- runtime wires -> brokers -->
	<path d="M624,162 C700,162 700,43  780,43"  fill="none" stroke="#ff7a18" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,84  780,84"  fill="none" stroke="#ff7a18" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,125 780,125" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,166 780,166" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,207 780,207" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,248 780,248" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,289 780,289" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,330 780,330" fill="none" stroke="#3a4152" stroke-width="1.3"/>
	<path d="M624,162 C700,162 700,371 780,371" fill="none" stroke="#3a4152" stroke-width="1.3"/>

	<!-- right: brokers -->
	<rect x="780" y="26"  width="200" height="34" rx="7" fill="#161922" stroke="#ff7a18" stroke-width="1.5"/><text x="880" y="48"  text-anchor="middle" fill="#e6e8ee">MT4</text>
	<rect x="780" y="67"  width="200" height="34" rx="7" fill="#161922" stroke="#ff7a18" stroke-width="1.5"/><text x="880" y="89"  text-anchor="middle" fill="#e6e8ee">Binance USDT futures</text>
	<rect x="780" y="108" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="130" text-anchor="middle" fill="#9aa3b2">OKX</text>
	<rect x="780" y="149" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="171" text-anchor="middle" fill="#9aa3b2">cTrader</text>
	<rect x="780" y="190" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="212" text-anchor="middle" fill="#9aa3b2">Interactive Brokers</text>
	<rect x="780" y="231" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="253" text-anchor="middle" fill="#9aa3b2">FIX-protocol brokers</text>
	<rect x="780" y="272" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="294" text-anchor="middle" fill="#9aa3b2">Proprietary-API brokers</text>
	<rect x="780" y="313" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="335" text-anchor="middle" fill="#9aa3b2">DEX</text>
	<rect x="780" y="354" width="200" height="34" rx="7" fill="#161922" stroke="#3a4152" stroke-width="1"/><text x="880" y="376" text-anchor="middle" fill="#9aa3b2">Custom backends</text>
</svg>
